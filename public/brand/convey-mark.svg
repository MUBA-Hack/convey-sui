  <path d="M11 16h15" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M22 12.2L27 16l-5 3.8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
