<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Convey">
  <!-- Convey mark: an open C (carry) with a route arrow passing through its
       opening — value carried across an air gap. Original geometric
       construction, monochrome, currentColor. Legible at 26–32px. -->
