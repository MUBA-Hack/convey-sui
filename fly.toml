app = "convey-sui"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  GONKA_MAX_RETRIES = "1"
  GONKA_REQUEST_TIMEOUT_MS = "30000"
  GONKA_ROUTER_BASE_URL = "https://api.gonkarouter.io/v1"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
